name: yf-exam

services:
  mysql:
    image: mysql:8.0
    container_name: yf-exam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "root@123"
      MYSQL_DATABASE: "yf_boot_exam"
      TZ: "Asia/Shanghai"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: yf-exam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
    external: true
    name: yf_exam_mysql_data
  redis-data:
    name: yf_exam_redis_data
