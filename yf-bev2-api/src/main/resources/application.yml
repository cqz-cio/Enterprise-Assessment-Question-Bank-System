server:
  port: 8080
  # Direct connections only; configure a trusted proxy explicitly before enabling forwarded addresses.
  forward-headers-strategy: none

security:
  jwt:
    # 必须通过环境变量或外部配置注入，不提供源码内默认密钥。
    secret: ${JWT_SECRET:}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  assignment-code:
    # 独立注入，禁止缺失时悄悄更换已有考核码使用的密钥。
    pepper: ${ASSIGNMENT_CODE_PEPPER:}

spring:
  application:
    name: yf-boot-api
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    deserialization:
      fail_on_unknown_properties: false
      accept-empty-string-as-null-object: true
    parser:
      # 允许出现特殊字符和转义符
      allow_unquoted_control_chars: true
      #允许出现单引号
      allow_single_quotes: true
    serialization:
      fail-on-empty-beans: false
    mapper:
      # 支持类型转换
      allow-coercion-of-scalars: true

