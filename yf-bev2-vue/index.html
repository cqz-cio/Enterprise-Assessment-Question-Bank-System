<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企业人才考核系统</title>
  </head>
  <body>
    <div id="app">
      <style>
        .app-loading {
          position: fixed;
          inset: 0;
          display: flex;
          box-sizing: border-box;
          padding: 24px;
          justify-content: center;
          align-items: center;
          background: #f0f2f5;
          color: #222d40;
          font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
        }

        .app-loading .app-loading-wrap {
          display: flex;
          width: 100%;
          align-items: center;
          flex-direction: column;
        }

        .app-loading .app-loading-logo {
          display: block;
          width: 300px;
          max-width: 100%;
          height: auto;
        }

        .app-loading .app-loading-title {
          margin: 24px 0 26px;
          font-size: 26px;
          font-weight: 600;
          line-height: 1.4;
          text-align: center;
        }

        .app-loading .app-loading-item {
          box-sizing: border-box;
          width: 30px;
          height: 30px;
          border: 3px solid #d6e5f9;
          border-top-color: #409eff;
          border-radius: 50%;
          animation: app-loading-spin 1.1s linear infinite;
        }

        @keyframes app-loading-spin {
          to {
            transform: rotate(360deg);
          }
        }

        @media (max-width: 639px) {
          .app-loading .app-loading-logo {
            width: 260px;
          }

          .app-loading .app-loading-title {
            font-size: 23px;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .app-loading .app-loading-item {
            animation: none;
          }
        }
      </style>
      <div class="app-loading" role="status" aria-label="正在加载系统">
        <div class="app-loading-wrap">
          <img src="/logo.png" class="app-loading-logo" alt="TRIPEER" />
          <div class="app-loading-title"><%= title %></div>
          <div class="app-loading-item" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
